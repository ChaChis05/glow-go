<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Administrador - Glow & Go</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        :root {
            --color-cereza: #7A1C32;
            --color-cereza-oscuro: #621628;
            --color-dorado: #D4AF37;
        }
        .barra-estetica {
            background: linear-gradient(135deg, #7A1C32 0%, #521221 100%);
            border-top: 2px solid #D4AF37;
            border-bottom: 2px solid #D4AF37;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">

    <!-- HEADER ADMIN -->
    <header class="bg-white border-b border-gray-100 sticky top-0 z-40 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-24 flex items-center justify-between">
            <div class="flex items-center space-x-3 py-2">
                <a href="index.html" class="flex items-center">
                    <img src="logo_glow.jpg" alt="Glow & Go" class="h-16 md:h-20 w-auto object-contain">
                </a>
                <span class="bg-[#7A1C32] text-white text-xs px-3 py-1 rounded-full font-bold uppercase tracking-wider">Panel Administrador</span>
            </div>
            <nav class="flex items-center space-x-4">
                <a href="index.html" class="text-sm font-bold text-[#7A1C32] hover:underline flex items-center">
                    <i class="fa-solid fa-store mr-1.5"></i> Ir a la Tienda
                </a>
            </nav>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-10">
        <div class="barra-estetica rounded-2xl py-5 px-6 mb-8 text-center text-white relative overflow-hidden shadow-md">
            <h1 class="text-2xl md:text-3xl font-black tracking-wide uppercase">⚙️ Gestión de Pedidos de Clientes</h1>
            <p class="text-xs text-amber-200 mt-1">Panel exclusivo para Zaidy Cano — Control de estados y carga de guías en PDF</p>
        </div>

        <div id="tabla-pedidos-admin" class="space-y-6">
            <!-- Se llena con JavaScript -->
        </div>

        <div id="admin-sin-pedidos" class="hidden text-center py-16 bg-white rounded-3xl shadow-sm border border-gray-100">
            <i class="fa-solid fa-clipboard-list text-6xl text-gray-300 mb-4"></i>
            <h2 class="text-xl font-bold text-gray-700 mb-2">No hay pedidos registrados en el sistema</h2>
            <p class="text-gray-500 text-sm">Los pedidos que realicen los clientes aparecerán aquí automáticamente.</p>
        </div>
    </main>

    <!-- SCRIPT DE SEGURIDAD Y GESTIÓN -->
    <script>
        const CORREO_ADMIN = "zaidycanobenavides@gmail.com";
        const PASSWORD_ADMIN = "chachis2905";

        function convertirPrecioANumero(precioStr) {
            if (!precioStr) return 0;
            let limpio = String(precioStr).replace(/[^0-9]/g, "");
            return parseFloat(limpio) || 0;
        }

        document.addEventListener("DOMContentLoaded", () => {
            let usuarioLogueado = localStorage.getItem("usuarioLogueado");

            if (!usuarioLogueado || usuarioLogueado.toLowerCase().trim() !== CORREO_ADMIN) {
                let passwordIngresada = prompt("🔒 Área protegida. Por favor ingresa la contraseña de administrador:");
                
                if (passwordIngresada === PASSWORD_ADMIN) {
                    localStorage.setItem("usuarioLogueado", CORREO_ADMIN);
                } else {
                    alert("Contraseña incorrecta. Acceso denegado.");
                    window.location.href = "index.html";
                    return;
                }
            }

            renderizarPedidosAdmin();
        });

        function renderizarPedidosAdmin() {
            const pedidos = JSON.parse(localStorage.getItem("glow_pedidos")) || [];
            const contenedor = document.getElementById("tabla-pedidos-admin");
            const sinPedidos = document.getElementById("admin-sin-pedidos");

            if (pedidos.length === 0) {
                sinPedidos.classList.remove("hidden");
                contenedor.innerHTML = "";
                return;
            }

            sinPedidos.classList.add("hidden");
            contenedor.innerHTML = pedidos.slice().reverse().map((pedido, indexReal) => {
                const realIndex = pedidos.length - 1 - indexReal;
                const itemsArray = pedido.items || pedido.productos || [];

                let badgeColor = "bg-amber-100 text-amber-800";
                if (pedido.estado && pedido.estado.includes("Confirmado")) badgeColor = "bg-blue-100 text-blue-800";
                if (pedido.estado && (pedido.estado.includes("Enviado") || pedido.estado.includes("Guía"))) badgeColor = "bg-green-100 text-green-800";

                return `
                    <div class="bg-white rounded-3xl p-6 shadow-sm border border-gray-100 space-y-4">
                        <div class="flex flex-col md:flex-row justify-between items-start md:items-center border-b pb-4 gap-2">
                            <div>
                                <span class="text-xs font-bold text-gray-400">PEDIDO #${pedido.id} — Cliente: <strong class="text-gray-800">${pedido.usuario || pedido.nombreCliente}</strong></span>
                                <p class="text-xs text-gray-500"><i class="fa-regular fa-clock mr-1"></i> ${pedido.fecha || 'Fecha no registrada'}</p>
                            </div>
                            <div class="flex items-center gap-2">
                                <span class="px-3 py-1 rounded-full text-xs font-bold ${badgeColor}">${pedido.estado || 'Pendiente'}</span>
                                <select onchange="actualizarEstado(${realIndex}, this.value)" class="text-xs font-bold px-3 py-2 rounded-xl border border-gray-200 bg-gray-50 cursor-pointer focus:ring-2 focus:ring-[#7A1C32]">
                                    <option value="Pendiente a confirmación" ${pedido.estado === 'Pendiente a confirmación' ? 'selected' : ''}>Pendiente a confirmación</option>
                                    <option value="Confirmado - Pendiente de guía" ${pedido.estado === 'Confirmado - Pendiente de guía' ? 'selected' : ''}>Confirmado - Pendiente de guía</option>
                                    <option value="Enviado con guía" ${pedido.estado === 'Enviado con guía' ? 'selected' : ''}>Enviado con guía</option>
                                </select>
                            </div>
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 text-sm text-gray-700">
                            <div>
                                <p><strong>Nombre:</strong> ${pedido.nombreCliente || 'No especificado'}</p>
                                <p><strong>Teléfono:</strong> <a href="https://wa.me/57${pedido.telefonoCliente || ''}" target="_blank" class="text-green-600 font-bold hover:underline"><i class="fa-brands fa-whatsapp"></i> ${pedido.telefonoCliente || 'N/A'}</a></p>
                                <p><strong>Correo:</strong> ${pedido.usuario || 'N/A'}</p>
                            </div>
                            <div>
                                <p><strong>Destino:</strong> ${pedido.ubicacion || 'No especificada'}</p>
                                <p><strong>Dirección:</strong> ${pedido.direccion || 'N/A'}</p>
                                <p><strong>Espec. vivienda:</strong> ${pedido.especificaciones || 'Ninguna'}</p>
                            </div>
                            <div>
                                <p><strong>Total:</strong> <span class="text-[#7A1C32] font-black text-base">$${(pedido.total || 0).toLocaleString("es-CO")}</span></p>
                                
                                <!-- Sección para Cargar Guía PDF y Número -->
                                <div class="mt-2 space-y-2 bg-red-50/50 p-3 rounded-2xl border border-red-100">
                                    <label class="block text-xs font-bold text-red-700">Cargar Guía de Envío (PDF + Número):</label>
                                    <input type="text" id="input-guia-texto-${realIndex}" value="${pedido.guiaTexto || ''}" placeholder="Número de guía..." class="text-xs px-3 py-2 border border-gray-200 rounded-xl w-full bg-white focus:outline-none focus:ring-2 focus:ring-red-500">
                                    
                                    <div class="flex items-center gap-2">
                                        <input type="file" id="input-guia-pdf-${realIndex}" accept="application/pdf" class="text-xs w-full text-gray-500 file:mr-2 file:py-1.5 file:px-3 file:rounded-xl file:border-0 file:text-xs file:font-extrabold file:bg-red-600 file:text-white hover:file:bg-red-700 cursor-pointer">
                                        <button onclick="guardarGuiaConPDF(${realIndex})" class="bg-red-600 hover:bg-red-700 text-white text-xs font-extrabold px-4 py-2 rounded-xl transition-colors cursor-pointer flex-shrink-0 shadow-sm">
                                            Guardar Guía
                                        </button>
                                    </div>
                                    ${pedido.guiaPdf ? `<p class="text-[10px] text-green-700 font-bold mt-1"><i class="fa-solid fa-circle-check"></i> PDF de guía cargado correctamente. <a href="${pedido.guiaPdf}" target="_blank" download="Guia_Envio_${pedido.id}.pdf" class="underline text-red-700 ml-1">Ver PDF</a></p>` : ''}
                                </div>
                            </div>
                        </div>

                        <div class="border-t pt-3">
                            <p class="text-xs font-bold text-gray-500 mb-1 uppercase tracking-wider">Productos solicitados:</p>
                            <div class="space-y-1">
                                ${itemsArray.map(item => {
                                    let pNum = convertirPrecioANumero(item.precio);
                                    return `
                                        <div class="text-xs text-gray-600 flex justify-between bg-gray-50 p-2 rounded-lg">
                                            <span>• ${item.nombre} (SKU:${item.sku || 'N/A'}) x${item.cantidad}</span>                                             <span class="font-semibold">$${(pNum * item.cantidad).toLocaleString("es-CO")}</span>
                                        </div>
                                    `;
                                }).join('')}
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        window.actualizarEstado = function(index, nuevoEstado) {
            let pedidos = JSON.parse(localStorage.getItem("glow_pedidos")) || [];
            pedidos[index].estado = nuevoEstado;
            localStorage.setItem("glow_pedidos", JSON.stringify(pedidos));
            renderizarPedidosAdmin();
            alert("¡Estado del pedido actualizado con éxito!");
        };

        window.guardarGuiaConPDF = function(index) {
            let pedidos = JSON.parse(localStorage.getItem("glow_pedidos")) || [];
            const textoGuia = document.getElementById(`input-guia-texto-${index}`).value.trim();
            const inputFile = document.getElementById(`input-guia-pdf-${index}`);

            pedidos[index].guiaTexto = textoGuia;
            pedidos[index].guia = textoGuia; // Compatible con la vista de mis pedidos

            if (inputFile.files && inputFile.files[0]) {
                const archivo = inputFile.files[0];
                const reader = new FileReader();

                reader.onload = function(e) {
                    pedidos[index].guiaPdf = e.target.result; // Guarda el PDF en Base64
                    pedidos[index].estado = "Enviado con guía";
                    localStorage.setItem("glow_pedidos", JSON.stringify(pedidos));
                    alert("¡Guía y archivo PDF cargados y guardados con éxito!");
                    renderizarPedidosAdmin();
                };

                reader.readAsDataURL(archivo);
            } else {
                if (textoGuia) {
                    pedidos[index].estado = "Enviado con guía";
                }
                localStorage.setItem("glow_pedidos", JSON.stringify(pedidos));
                alert("¡Número de guía guardado correctamente!");
                renderizarPedidosAdmin();
            }
        };
    </script>
</body>
</html>
